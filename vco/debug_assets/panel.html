<!DOCTYPE html>
<html lang="zh-CN" data-vco-panel="vco-debug-panel">
<head>
<meta charset="utf-8">
<meta name="vco-panel" content="vco-debug-panel">
<title>VCO</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif;
         color: #1a1a1a; background: #f5f5f7; height: 100vh;
         display: grid; grid-template-columns: 1fr 360px; overflow: hidden; }
  #left { display: flex; flex-direction: column; min-width: 0; background: #1f2937; }
  #chrome-bar { display: flex; gap: 4px; padding: 6px; background: #111827;
                border-bottom: 1px solid #374151; align-items: center; }
  #chrome-bar button { padding: 3px 9px; border: 1px solid #4b5563;
                       background: #374151; color: #e5e7eb; border-radius: 4px;
                       cursor: pointer; font: 12px -apple-system; }
  #chrome-bar button:hover { background: #4b5563; }
  #url { flex: 1; padding: 4px 8px; border: 1px solid #4b5563;
         background: #0b1220; color: #e5e7eb; border-radius: 4px;
         font: 12px ui-monospace, monospace; }
  #url:focus { outline: 1px solid #60a5fa; }
  #viewport { flex: 1; overflow: auto; background: #0b1220; padding: 8px; }
  /* #stage is sized from the screenshot's natural size (see fitStage) so the
     event mask always covers exactly the rendered page, never the letterbox. */
  #stage { position: relative; margin: 0 auto; background: #fff;
           box-shadow: 0 0 0 1px #374151; }
  #frame { display: block; width: 100%; height: 100%;
           image-rendering: -webkit-optimize-contrast;
           user-select: none; -webkit-user-drag: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  /* The mask is the keyboard sink: it is contenteditable so the browser will
     hand us `beforeinput`, `paste` and IME composition. Its own text is always
     cleared immediately (we forward it to the page instead). */
  .event-mask { position: absolute; inset: 0; cursor: crosshair; outline: none;
                color: transparent; caret-color: transparent; }
  .event-mask:focus { outline: none; }
  .event-mask.dim { cursor: copy; }
  .marker { position: absolute; border: 2px solid #f97316;
            background: rgba(249, 115, 22, 0.12); border-radius: 2px;
            pointer-events: none; }
  .marker .tag { position: absolute; top: -9px; left: -2px; background: #f97316;
                 color: #fff; font: 10px/1.5 ui-monospace, monospace;
                 padding: 0 4px; border-radius: 3px; white-space: nowrap; }
  .marker.hot { border-color: #2563eb; background: rgba(37, 99, 235, 0.16); }
  .marker.hot .tag { background: #2563eb; }
  .marker.stale { border-style: dashed; border-color: #9ca3af; background: none; }
  #right { border-left: 1px solid #d1d1d6; background: #fff; overflow-y: auto;
           padding: 10px; display: flex; flex-direction: column; gap: 9px; }
  #hover-line { font: 10.5px/1.4 ui-monospace, monospace; color: #9ca3af;
                min-height: 13px; word-break: break-all; }
  .sec-row { display: flex; gap: 6px; align-items: center; }
  .sec-row > strong { font: 11px/1.4 -apple-system; color: #6b7280;
                      font-weight: 600; text-transform: uppercase;
                      letter-spacing: 0.04em; flex: 1; }
  .sec-row .count { color: #2563eb; font-weight: 600; }
  .card { border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px;
          background: #fafafa; }
  input, textarea { width: 100%; font: 12px -apple-system;
                    padding: 4px 6px; border: 1px solid #d1d1d6;
                    border-radius: 4px; background: #fff; }
  button { padding: 5px 10px; border: 1px solid #d1d1d6; background: #fff;
           border-radius: 4px; cursor: pointer; font: 12px -apple-system; }
  button:hover { background: #f3f4f6; }
  button.link { border: 0; background: none; color: #2563eb; padding: 2px 4px; }
  button.link:hover { text-decoration: underline; background: none; }
  .fcard-meta { color: #6b7280; font: 10.5px/1.45 ui-monospace, monospace;
                word-break: break-all; }
  .pick-card { position: relative; border: 1px solid #d1d5db;
               border-radius: 6px; background: #fff; padding: 8px 10px 10px;
               margin-bottom: 8px; }
  .pick-card.hot { border-color: #2563eb; box-shadow: 0 0 0 2px #dbeafe; }
  /* The × floats over the screenshot (which leads the card), so it needs its
     own backdrop to stay visible against arbitrary page content. */
  .pick-card .pick-close { position: absolute; top: 10px; right: 12px; z-index: 2;
                           border: 0; border-radius: 4px;
                           background: rgba(255, 255, 255, 0.88); color: #6b7280;
                           cursor: pointer; font-size: 14px; line-height: 1;
                           padding: 2px 5px; }
  .pick-card .pick-close:hover { color: #ef4444; }
  /* The element's own screenshot leads the card: it is the card's identity.
     Edge-to-edge so it reads as a picture, not a thumbnail. */
  .pick-card .pick-shot { margin: -8px -10px 6px; overflow: hidden;
                          border-bottom: 1px solid #e5e7eb;
                          border-radius: 6px 6px 0 0; background: #f9fafb; }
  .pick-card .pick-shot img { display: block; width: 100%; height: auto;
                              cursor: zoom-in; }
  .pick-card .pick-sel { color: #1d4ed8; font: 11px/1.45 ui-monospace, monospace;
                         word-break: break-all; }
  .pick-card .pick-num { display: inline-block; min-width: 16px;
                         background: #f97316; color: #fff; border-radius: 3px;
                         text-align: center; font-size: 10px; padding: 0 3px;
                         margin-right: 4px; }
  .pick-card textarea { width: 100%; min-height: 44px; margin-top: 6px;
                        font: 12px -apple-system; padding: 4px 6px;
                        border: 1px solid #d1d1d6; border-radius: 4px;
                        background: #fffbeb; resize: vertical; }
  .pick-card textarea:focus { background: #fff; outline: 1px solid #93c5fd; }
  .pick-card .pick-acts { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .pick-card .pick-acts button { padding: 2px 10px; border-radius: 5px;
                                 border: 1px solid #2563eb; background: #2563eb;
                                 color: #fff; cursor: pointer; font: 11px -apple-system; }
  .pick-card .pick-acts button:hover { background: #1d4ed8; }
  .pick-card .pick-status { color: #16a34a; font: 11px -apple-system; }
  #picks-empty { color: #9ca3af; font-size: 12px; }
  /* A dead socket used to be invisible: the old screenshot stayed on screen and
     every click was dropped without a word. Now it says so. */
  #link-banner { display: none; padding: 6px 10px; background: #7f1d1d; color: #fee2e2;
                 font: 12px -apple-system; border-bottom: 1px solid #991b1b; }
  #link-banner.on { display: block; }
</style>
</head>
<body>
<div id="left">
  <div id="link-banner">
    ⚠ 与 vco 服务的连接已断开（多半是服务重启过）——正在自动重连。若一直不恢复，请刷新本页。
  </div>
  <div id="chrome-bar">
    <button id="btn-back" title="Back">←</button>
    <button id="btn-forward" title="Forward">→</button>
    <button id="btn-reload" title="Reload">⟳</button>
    <input id="url" placeholder="输入 URL 后回车（可贴 http://127.0.0.1:3080/）">
  </div>
  <div id="viewport">
    <div id="stage">
      <img id="frame" alt="browser screenshot">
      <div id="overlay"></div>
      <div class="event-mask" id="mask" tabindex="0" contenteditable="true"
           spellcheck="false" autocapitalize="off" autocorrect="off"
           aria-label="受控浏览器视口：点击操作页面，⌘/Ctrl+点击锁定元素"></div>
    </div>
  </div>
</div>
<div id="right">
  <!-- The sidebar is deliberately thin: what is under the cursor, which page
       the controlled browser is on, and the pick cards. -->
  <div class="card" style="padding:5px 8px">
    <div id="target-url" class="fcard-meta" style="margin:0">—</div>
    <div id="hover-line"></div>
  </div>

  <div>
    <div class="sec-row">
      <strong>锁定元素 <span class="count" id="picks-count">0</span></strong>
      <button id="btn-clear-picks" class="link">清空</button>
    </div>
    <div id="picks-stack"></div>
  </div>
</div>
<script src="/static/panel.js"></script>
<textarea id="clip-helper" aria-hidden="true"
          style="position:fixed;left:-9999px;top:0;width:10px;height:10px"></textarea>
</body>
</html>
